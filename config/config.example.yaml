# Copy to /data/config.yaml. Every hardware tunable lives here, not in code.
version: 1

matrix:
  hardware_mapping: adafruit-hat-pwm  # needs the GPIO4-GPIO18 bonnet mod; else adafruit-hat
  panel_size: 64
  gpio_slowdown: 2                    # raise if you see flicker/garbage, lower for refresh rate
  pwm_bits: 6                         # 6, not 7: the refresh buffer must stay in the Pi 3B L2 (7 bits: 4x the deep refresh stalls on motion)
  pwm_dither_bits: 1                  # dither 2 flickered visibly in dim tones
  pwm_lsb_nanoseconds: 100
  limit_refresh_rate_hz: 100          # steady cap: unlimited it swings 103-155Hz under load, which flickers
  disable_busy_waiting: true          # sleep out the refresh cap, don't spin: spinning at RT 99 gets RT-throttled ~once a second
  show_refresh_rate: false            # true prints refresh Hz to the terminal
  # Chain order: the first entry is the panel plugged into the bonnet.
  # col/row place it on the portrait grid (0,0 = top-left).
  # rotate: how far that panel is physically turned clockwise (0/90/180/270).
  panels:
    # rotate: as mounted on this wall (set with the panel-id pattern, Oct 2026)
    - {col: 0, row: 0, rotate: 0}    # 1 top-left
    - {col: 1, row: 0, rotate: 0}    # 2 top-right
    - {col: 1, row: 1, rotate: 180}  # 3 middle-right
    - {col: 0, row: 1, rotate: 90}   # 4 middle-left
    - {col: 0, row: 2, rotate: 0}    # 5 bottom-left
    - {col: 1, row: 2, rotate: 90}   # 6 bottom-right

power:
  ceiling_amps: 13.0               # frames are scaled down to never exceed this (15 max: the supply)
  amps_full_white_per_panel: 2.2   # measured on these P3 panels: 2 at full white = 22W at the 20V input (~2.0A each at 5V); code default 6.0 if unset

# effective brightness = min(user, auto), then the power limiter on top.
brightness:
  user: 100   # percent, the brightness slider
  auto: true  # follow the BH1750; with no sensor this falls back to user
  # Auto curve: lux_low and darker gives min_pct, lux_high and brighter max_pct,
  # log-interpolated in between. smoothing_s: time constant, so it fades instead of jumping.
  auto_curve: {lux_low: 2, min_pct: 10, lux_high: 400, max_pct: 100, smoothing_s: 3}

sensors:
  bh1750:
    i2c_bus: 1      # /dev/i2c-1 (GPIO2 SDA, GPIO3 SCL)
    address: 0x23   # ADDR pin low; 0x5c if ADDR is high
    poll_ms: 500

# socket, preview_socket, user, group: where the engine's sockets go and whom it drops root
# to. The web app connects to socket/preview_socket. The engine itself only reads these four
# keys when it is NOT root (dev, make sim): as root (sudo, the systemd unit) it ignores them
# and uses its --socket/--preview-socket/--user/--group flags (ledposter-engine.service) or
# the defaults below, because this file belongs to the web app's user (docs/DEVIATIONS.md).
engine:
  socket: /run/ledposter/engine.sock          # control: newline-delimited JSON (docs/protocol.md)
  preview_socket: /run/ledposter/frames.sock  # output frames for the live preview
  preview_fps: 5                              # each frame is 73KB over Wi-Fi; 15 stalled the panel refresh (8x the deep stalls)
  user: daemon                                # dev only (see above): the account the engine drops to; never root
  group: daemon                               # dev only: the sockets' group; the web app must run in it (or as root)

display:
  gamma: 2.2   # engine LUT for patterns, effects, clock and text; the transcoder bakes the same curve into media

# BDF fonts for text, clock and on-wall messages. Default: the fonts of the
# vendor/rpi-rgb-led-matrix checkout the engine was built from.
# fonts:
#   dir: /home/pi/ledposter/vendor/rpi-rgb-led-matrix/fonts

# One momentary push button between a GPIO and GND (README: Wiring). The engine
# turns on the pull-up, so pressed reads low. Remove `gpio` to turn it off.
button:
  gpio: 25              # BCM number: header pin 22 (GND next to it on pin 20); free on adafruit-hat(-pwm)
  chip: /dev/gpiochip0  # the Pi 3B's GPIO controller
  debounce_ms: 30
  long_ms: 2000         # held this long, then released: display on/off
  very_long_ms: 10000   # held this long: Wi-Fi setup (fires while still held)
  double_ms: 350        # two short presses this close: show the IP (0: off; short presses then act at once)
  skip_playlist_items: true  # short press in a playlist: its next item; after the last one, the next cycle entry
  # Short press: the next entry. Same fields as set_mode (docs/protocol.md);
  # quote colors ("ff0000") so YAML keeps them as text.
  cycle:
    - {mode: effect, effect: plasma}
    - {mode: effect, effect: fire}
    - {mode: effect, effect: spider-sense}
    - {mode: effect, effect: web-shot}
    - {mode: effect, effect: uav-radar}
    - {mode: effect, effect: starfield}
    - {mode: clock, date: true}
    - {mode: playlist, playlist: demo}
    - {mode: idle}

# Named playlists for `ledengine --playlist NAME`. media is a media id: a folder
# in $LEDPOSTER_DATA/media made by `python -m ledposter.transcode`.
# duration_s is optional: default is one full play of the item, 10s for stills.
playlists:
  demo:
    loop: true      # false: stop on the last frame of the last item
    shuffle: false  # true: new random order every pass
    items:
      - {media: example-gif}
      - {media: example-photo, duration_s: 15}

# Web app (milestone 4). The admin password hash and API token hashes are added
# here by the app on first run; the app rewrites this file atomically, mode 600.
web:
  port: 80           # dev: python -m ledposter --port 8080

# Enforced by the web app's scheduler (it sends power / set_brightness to the engine).
schedule:
  enabled: false
  'on': '07:00'
  'off': '23:00'
  days: [0, 1, 2, 3, 4, 5, 6]   # 0 = Monday; the day the "on" time falls on
  quiet:                        # brightness cap, e.g. at night
    enabled: false
    start: '22:00'
    end: '07:00'
    max_brightness: 20

# Networking (milestone 6). The web app drives NetworkManager with nmcli; addresses are DHCP
# by default (stable client id = MAC), optional static IP from Settings with a 2-minute rollback.
network:
  hotspot_ssid: LEDWall-Setup   # first-time setup hotspot; its password is $LEDPOSTER_DATA/setup-password (on the card)
  hotspot_ip: 10.42.0.1         # must match system/NetworkManager/dnsmasq-shared.d/ledposter-captive.conf
  setup_timeout_s: 60           # no network this long after the web app starts: raise the hotspot
  show_ip_s: 10                 # how long the hostname + IP stay on the wall at boot
  wifi_device: ''               # '' = first Wi-Fi device (wlan0 on the Pi)

# Home Assistant over MQTT (web app). Optional keys: device_id (default: from the
# MAC address), device_name, discovery_prefix (homeassistant), base_topic (ledposter).
mqtt: {enabled: false, host: '', port: 1883, username: '', password: '', tls: false}

# Streaming input (engine), off by default. Pixels are RGB, row-major from the
# top-left of the 128x192 canvas. While frames arrive they replace the current
# mode; timeout_s after the last packet the wall goes back to it.
ddp: {enabled: false}                    # port: 4048
e131: {enabled: false, start_universe: 1, multicast: false}  # port: 5568; 170 pixels per universe
stream: {apply_gamma: true}              # true: input is sRGB, gets display.gamma; timeout_s: 5
