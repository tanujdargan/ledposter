# Single-panel bring-up: one panel on the bonnet, 64x64 canvas.
version: 1

matrix:
  hardware_mapping: adafruit-hat-pwm  # needs the GPIO4-GPIO18 bonnet mod; else adafruit-hat
  panel_size: 64
  gpio_slowdown: 2                    # raise if you see flicker/garbage, lower for refresh rate
  pwm_bits: 9
  show_refresh_rate: false            # true prints refresh Hz to the terminal
  # Chain order: the first entry is the panel plugged into the bonnet.
  # col/row place it on the portrait grid (0,0 = top-left).
  # rotate: how far that panel is physically turned clockwise (0/90/180/270).
  panels:
    - {col: 0, row: 0}

power:
  ceiling_amps: 13.0               # frames are scaled down to never exceed this
  amps_full_white_per_panel: 6.0   # calibration: measure one panel at full white and set this

# effective brightness = min(user, auto), then the power limiter on top.
brightness:
  user: 100   # percent, the brightness slider
  auto: true  # follow the BH1750; with no sensor this falls back to user
  # Auto curve: lux_low and darker gives min_pct, lux_high and brighter max_pct,
  # log-interpolated in between. smoothing_s: time constant, so it fades instead of jumping.
  auto_curve: {lux_low: 2, min_pct: 10, lux_high: 400, max_pct: 100, smoothing_s: 3}

sensors:
  bh1750:
    i2c_bus: 1      # /dev/i2c-1 (GPIO2 SDA, GPIO3 SCL)
    address: 0x23   # ADDR pin low; 0x5c if ADDR is high
    poll_ms: 500

engine:
  socket: /run/ledposter/engine.sock          # control: newline-delimited JSON (docs/protocol.md)
  preview_socket: /run/ledposter/frames.sock  # output frames for the live preview
  preview_fps: 15                             # max preview messages per second per client
  user: daemon                                # the engine drops root to user:group after startup (sockets are chowned to it)
  group: daemon                               # the web app must run in this group (or as root) to use the sockets

display:
  gamma: 2.2   # engine LUT for patterns, effects, clock and text; the transcoder bakes the same curve into media

# BDF fonts for text, clock and on-wall messages. Default: the fonts of the
# vendor/rpi-rgb-led-matrix checkout the engine was built from.
# fonts:
#   dir: /home/pi/ledposter/vendor/rpi-rgb-led-matrix/fonts

# One momentary push button between a GPIO and GND (README: Wiring). The engine
# turns on the pull-up, so pressed reads low. Remove `gpio` to turn it off.
button:
  gpio: 25              # BCM number: header pin 22 (GND next to it on pin 20); free on adafruit-hat(-pwm)
  chip: /dev/gpiochip0  # the Pi 3B's GPIO controller
  debounce_ms: 30
  long_ms: 2000         # held this long, then released: display on/off
  very_long_ms: 10000   # held this long: Wi-Fi setup (fires while still held)
  skip_playlist_items: true  # short press in a playlist: its next item; after the last one, the next cycle entry
  # Short press: the next entry. Same fields as set_mode (docs/protocol.md);
  # quote colors ("ff0000") so YAML keeps them as text.
  cycle:
    - {mode: effect, effect: plasma}
    - {mode: effect, effect: fire}
    - {mode: effect, effect: spider-sense}
    - {mode: effect, effect: web-shot}
    - {mode: effect, effect: uav-radar}
    - {mode: effect, effect: starfield}
    - {mode: clock, date: true}
    - {mode: playlist, playlist: demo}
    - {mode: idle}

# Named playlists for `ledengine --playlist NAME`. media is a media id: a folder
# in $LEDPOSTER_DATA/media made by `python -m ledposter.transcode --w 64 --h 64`
# (this canvas is 64x64; the engine refuses media made for another size).
# duration_s is optional: default is one full play of the item, 10s for stills.
playlists:
  demo:
    loop: true      # false: stop on the last frame of the last item
    shuffle: false  # true: new random order every pass
    items:
      - {media: example-gif}
      - {media: example-photo, duration_s: 15}
