# Captive portal DNS for the LEDWall-Setup hotspot. NetworkManager starts its own dnsmasq
# for connections in ipv4.method=shared and reads /etc/NetworkManager/dnsmasq-shared.d/, so
# this only applies while the hotspot is up. Every name resolves to the hotspot address; the
# web app then answers the OS connectivity probes with a redirect to /setup.
# Installed by M8. The address must match network.hotspot_ip in config.yaml.
address=/#/10.42.0.1
no-resolv
