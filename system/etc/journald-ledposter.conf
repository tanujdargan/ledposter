# /etc/systemd/journald.conf.d/ledposter.conf (installed by system/install.sh).
# In RAM, not on the card: the engine logs as it runs, and a persistent journal turned that into
# a card write every few seconds. Tried 2026-10-17 (persistent, 15s sync): the next power pulls
# hit those writes and left ext4 with corrupt block bitmaps (f3 then verified the card itself
# fine). What must survive goes to /data/logs (web.log, update.log, maintenance.log).
[Journal]
Storage=volatile
RuntimeMaxUse=32M
RuntimeKeepFree=64M
