# /etc/systemd/journald.conf.d/ledposter.conf (installed by system/install.sh).
# Persistent so the log of a crash or a lost network survives the reboot that follows it
# (journalctl -b -1). On a read-only overlay root /var/log/journal is RAM anyway, which is why
# both caps are small. journald syncs to the card every 5 minutes, not per line, so wear is low.
# What must always survive still goes to /data/logs (web.log, update.log, maintenance.log).
[Journal]
Storage=persistent
SystemMaxUse=48M
SystemKeepFree=512M
RuntimeMaxUse=32M
RuntimeKeepFree=64M
