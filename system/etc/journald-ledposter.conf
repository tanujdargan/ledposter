# /etc/systemd/journald.conf.d/ledposter.conf (installed by system/install.sh).
# The root filesystem is a read-only overlay, so the journal lives in RAM and is gone at
# reboot: fine for system logs (the engine logs once a second). What must survive goes to
# /data/logs (web.log, update.log, maintenance.log). Capped so a chatty day cannot eat RAM.
[Journal]
Storage=volatile
RuntimeMaxUse=32M
RuntimeKeepFree=64M
