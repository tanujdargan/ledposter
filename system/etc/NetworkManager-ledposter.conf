# /etc/NetworkManager/conf.d/ledposter.conf (installed by system/install.sh).
# Defaults for every connection profile: a stable DHCP client id (the MAC) so routers hand
# back the same lease after a reboot (docs/spec.md "Addressing"), and no Wi-Fi power
# saving, which otherwise makes ledposter.local slow to answer. The web app also sets the
# DHCP options explicitly on the profiles it creates (net.py ensure_stable_dhcp).
[connection]
ipv4.dhcp-client-id=mac
ipv4.dhcp-send-hostname=yes
wifi.powersave=2
