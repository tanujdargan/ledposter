# /etc/sysctl.d/90-ledposter.conf (installed by system/install.sh).
# E1.31 multicast: one group per universe, 145 universes for 128x192 (docs/DEVIATIONS.md M7).
net.ipv4.igmp_max_memberships = 160
# Do NOT set kernel.sched_rt_runtime_us = -1. Tried on the wall (Pi 3B): with RT throttling off,
# the matrix library's realtime refresh thread starved the kernel's housekeeping on core 3 and
# the Pi stopped accepting SSH and web connections. The default (950000) keeps it healthy.
