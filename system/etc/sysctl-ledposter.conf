# /etc/sysctl.d/90-ledposter.conf (installed by system/install.sh).
# E1.31 multicast: one group per universe, 145 universes for 128x192 (docs/DEVIATIONS.md M7).
net.ipv4.igmp_max_memberships = 160
# The matrix library's refresh thread runs realtime on the isolated core 3; the default RT
# throttling (950ms of every second) can stall it for the rest. -1 turns the throttling off
# (tuned on the wall's hardware).
kernel.sched_rt_runtime_us = -1
